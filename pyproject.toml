[project]
name = "garmin-watch-mcp"
version = "0.1.0"
description = "MCP server exposing Garmin watch health and activity data from Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "garmin", "garmin-connect", "fitness", "sleep", "heart-rate", "wearables"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "garminconnect>=0.3.16,<0.4",
    "mcp>=2.2,<3",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/osjayaprakash/garmin-watch-mcp"
Documentation = "https://garmin-watch-mcp.readthedocs.io"
Issues = "https://github.com/osjayaprakash/garmin-watch-mcp/issues"

[project.optional-dependencies]
langfuse = ["langfuse>=4,<5"]

[project.scripts]
garmin-watch-mcp = "garmin_watch_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "INSTALL.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_watch_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Garmin Connect API (needs saved tokens or GARMIN_EMAIL/PASSWORD)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
